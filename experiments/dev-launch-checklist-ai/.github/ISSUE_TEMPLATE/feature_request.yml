name: Feature request
description: Propose a new check, report format, or workflow.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What user outcome is blocked today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should the scanner output and why?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence strategy
      description: Which files or signals should this check rely on?
